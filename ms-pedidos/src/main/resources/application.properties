server.port=8082
spring.application.name=ms-pedidos

# Configuración de conexión a la base de datos independiente
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pedidos_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# URL del servicio de productos (Docker inyecta este valor en ejecución)
productos.service.url=${PRODUCTOS_URL:http://localhost:8081}

logging.level.com.duoc.pedidos=INFO